<title>ChartsTrade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChartsTrade">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: floating sidebar "cockpit" + one scrolling stage; trading-desk navy with candle-flame amber */
:root{
  --bg:#e9edf3; --surface:#ffffff; --surface-2:#f4f6fa; --ink:#111d33; --muted:#5a6a82; --line:#d5dce7;
  --accent:#e8930c; --accent-soft:#fdf0d8; --accent-ink:#3a2300;
  --up:#0e9a74; --up-soft:#dcf4ec; --down:#de4249; --down-soft:#fbe3e4; --info:#3567d6;
  --shadow:0 1px 2px rgba(17,29,51,.06),0 8px 24px rgba(17,29,51,.06);
  --hero:#111d33; --hero-fg:#f3f6fb; --hero-muted:#b7c3d6;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1322; --surface:#121d31; --surface-2:#18253d; --ink:#e7ecf4; --muted:#8c9cb5; --line:#22314c;
  --accent:#ffb43a; --accent-soft:#33270f; --accent-ink:#1d1300;
  --up:#2cc497; --up-soft:#113428; --down:#ff6168; --down-soft:#3a1b20; --info:#7aa2ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); --hero:#17243c; --hero-fg:#f3f6fb; --hero-muted:#a3b1c7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1322; --surface:#121d31; --surface-2:#18253d; --ink:#e7ecf4; --muted:#8c9cb5; --line:#22314c;
  --accent:#ffb43a; --accent-soft:#33270f; --accent-ink:#1d1300;
  --up:#2cc497; --up-soft:#113428; --down:#ff6168; --down-soft:#3a1b20; --info:#7aa2ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); --hero:#17243c; --hero-fg:#f3f6fb; --hero-muted:#a3b1c7; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,3.4vw,42px);font-weight:800}
h2{font-size:24px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;border:1px solid var(--line);border-bottom-width:2px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;height:100%;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px;padding:20px 14px;min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:800;letter-spacing:-.02em}
.stats{background:var(--surface-2);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.lvl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.lvl b{font-family:var(--f-display);font-size:15px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .5s}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.chip.up{background:var(--up-soft);color:var(--up);border-color:transparent}
.chip.down{background:var(--down-soft);color:var(--down);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--ink);border-color:transparent}
nav{display:grid;gap:4px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:0;background:none;cursor:pointer;font-weight:600;text-align:left;min-height:48px}
.nav svg{width:22px;height:22px;flex:none}
.nav span{flex:1}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--ink);color:var(--surface)}
.nav.on kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.6}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px;display:grid;gap:8px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;text-align:left}

main{min-height:0;overflow-y:auto;overflow-x:hidden;border-radius:20px;-webkit-overflow-scrolling:touch}
.stage{max-width:1180px;margin:0 auto;display:grid;gap:22px;padding:8px 4px 40px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:22px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05);background:var(--accent)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.up{background:var(--up);border-color:var(--up);color:#fff}
.btn.down{background:var(--down);border-color:var(--down);color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn kbd{background:rgba(255,255,255,.25);border-color:rgba(0,0,0,.15);color:inherit}
.btn.big{min-height:58px;font-size:18px;padding:0 26px}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:center;background:var(--hero);color:var(--hero-fg);border-radius:24px;padding:30px;position:relative;overflow:hidden}
.hero .eyebrow{color:var(--accent)}
.hero p{color:var(--hero-muted);max-width:46ch}
.hero canvas{width:100%;height:170px;display:block}
.segs{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:4px}
.segs i{height:8px;border-radius:4px;background:var(--hero-muted);opacity:.3}
.segs i.done{opacity:1}
.segs i.done{background:var(--accent)}
.quest{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:0}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.tick.ok{background:var(--up);border-color:var(--up);color:#fff}
.game{display:flex;flex-direction:column;gap:12px;cursor:pointer;border:0;text-align:left;transition:transform .12s}
.game:hover{transform:translateY(-2px)}
.game .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.game .ico svg{width:26px;height:26px}
.game .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.tip{border-left:0;background:var(--accent-soft);color:var(--ink)}
.streak{display:grid;gap:14px}
.streak-top{display:flex;align-items:center;gap:16px}
.streak-num{font-family:var(--f-display);font-size:52px;font-weight:800;line-height:1}
.flame{flex:none;transform-origin:50% 90%}
.flame.lit{animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.05,.97) rotate(-2deg)}60%{transform:scale(.97,1.04) rotate(2deg)}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week span{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em}
.dot{aspect-ratio:1;max-width:44px;width:100%;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line)}
.dot.met{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot.frz{background:var(--info);border-color:var(--info);color:#fff}
.dot.today{border-color:var(--accent);border-style:dashed}
.dot.fut{opacity:.4}
.dot svg{width:55%;height:55%}
.risk{background:var(--down-soft);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.okline{background:var(--up-soft);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:280px}
.heat i{aspect-ratio:1;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.heat i.met{background:var(--accent);border-color:transparent}
.heat i.frz{background:var(--info);border-color:transparent}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.heat i.fut{opacity:.3}
.pop{text-align:center;justify-items:center;padding:34px 24px!important}
.disclaimer{font-size:12px;color:var(--muted);text-align:center}

/* Path */
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mod{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.mod .no{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;font-weight:800;background:var(--surface-2);border:2px solid var(--line)}
.mod.done .no{background:var(--up);border-color:var(--up);color:#fff}
.mod.open .no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mod.locked{opacity:.55}
.mod .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mod .btn{min-height:44px;padding:0 14px;font-size:15px}

/* Player */
.player{max-width:820px;margin:0 auto;width:100%}
.ptop{display:flex;align-items:center;gap:14px}
.ptop .bar{flex:1;height:10px}
.lesson{display:grid;gap:16px;font-size:18px;line-height:1.6}
.lesson ul{margin:0;padding-left:22px;display:grid;gap:6px}
.lesson b{color:var(--ink)}
.fig{background:var(--surface-2);border-radius:var(--r);padding:14px;display:flex;justify-content:center;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.formula{font-family:var(--f-mono);font-size:16px;background:var(--accent-soft);border-radius:12px;padding:12px 16px}
.warn{background:var(--down-soft);border-radius:12px;padding:12px 16px;font-size:16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;min-height:58px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:17px}
.opt:hover{border-color:var(--muted)}
.opt kbd{font-size:13px}
.opt.right{border-color:var(--up);background:var(--up-soft)}
.opt.wrong{border-color:var(--down);background:var(--down-soft)}
.opt[disabled]{cursor:default}
.why{border-radius:12px;padding:12px 16px;font-size:16px;background:var(--surface-2)}
.navrow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.score-big{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1}

/* Games */
.gtop{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.gtop .bar{flex:1;min-width:120px;height:12px}
.gstat{display:flex;flex-direction:column;align-items:flex-end}
.gstat b{font-family:var(--f-mono);font-size:24px}
.gstat small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.pfig{background:var(--surface-2);border-radius:16px;padding:12px;display:flex;justify-content:center}
.pfig svg{width:100%;max-width:560px;height:auto}
.opts.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.combo{font-family:var(--f-display);font-weight:800;color:var(--accent)}
.qtext{font-size:20px;font-weight:600;line-height:1.45}
.flash-ok{animation:fok .35s}
.flash-no{animation:fno .35s}
@keyframes fok{0%{box-shadow:0 0 0 0 var(--up)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes fno{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Simulator */
.sim{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;height:calc(100% - 4px);min-height:560px}
.sim-chart{display:flex;flex-direction:column;gap:10px;min-height:0;padding:16px}
.sim-chart .cwrap{flex:1;min-height:320px;position:relative}
.sim-chart canvas{position:absolute;inset:0;width:100%;height:100%}
.sim-side{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto;padding:18px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:8px 0;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}
.seg button.on{background:var(--surface);box-shadow:var(--shadow)}
.tbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbtns .btn{min-height:52px;padding:0 10px;font-size:15px}
.coach{background:var(--surface-2);border-radius:12px;padding:12px;font-size:14px;display:grid;gap:8px}
.tlist{font-size:13px;display:grid;gap:4px}
.tlist div{display:flex;justify-content:space-between;font-family:var(--f-mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.pos{border-radius:12px;padding:12px;border:2px solid var(--line)}
.pos.long{border-color:var(--up)}
.pos.short{border-color:var(--down)}

/* Profile */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.badge{border-radius:14px;padding:14px;background:var(--surface-2);display:grid;gap:4px;opacity:.45}
.badge.got{opacity:1;background:var(--accent-soft)}
.badge b{font-family:var(--f-display)}
.badge small{font-size:13px;color:var(--muted)}
.bigstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.bigstats div{background:var(--surface-2);border-radius:14px;padding:14px}
.bigstats b{display:block;font-family:var(--f-mono);font-size:26px}

/* Overlays */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;z-index:50;pointer-events:none;width:min(520px,calc(100% - 32px))}
@media (max-width:860px){.toasts{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:var(--shadow);animation:tin .25s ease-out}
.toast.xp{background:var(--accent);color:var(--accent-ink)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
.modal{position:fixed;inset:0;background:rgba(5,10,20,.5);display:grid;place-items:center;z-index:40;padding:20px}
.modal .card{max-width:640px;width:100%;max-height:85vh;overflow:auto}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px;align-items:center}

@media (max-width:1100px){.sim{grid-template-columns:minmax(0,1fr) 290px}}
@media (max-width:980px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}.hero canvas{height:120px}}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:10px}
  .side{order:2;flex-direction:row;padding:6px;border-radius:16px;overflow:visible}
  .side .brand,.side .stats,.side-foot{display:none}
  nav{grid-template-columns:repeat(5,1fr);width:100%}
  .nav{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;text-align:center}
  .nav kbd{display:none}
  .mods,.grid2{grid-template-columns:1fr}
  .sim{grid-template-columns:1fr;height:auto}
  .sim-chart .cwrap{min-height:340px}
  .bigstats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){.grid3,.opts.g2{grid-template-columns:1fr}.card{padding:16px}.hero{padding:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <aside class="side" aria-label="Navigation">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="4" y="11" width="6" height="12" rx="1.5" fill="var(--down)"/><line x1="7" y1="6" x2="7" y2="27" stroke="var(--down)" stroke-width="2"/><rect x="18" y="7" width="6" height="14" rx="1.5" fill="var(--up)"/><line x1="21" y1="3" x2="21" y2="25" stroke="var(--up)" stroke-width="2"/><circle cx="21" cy="3" r="2.6" fill="var(--accent)"/></svg>
      <b>ChartsTrade</b>
    </div>
    <div class="stats" id="stats"></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <span>Drücke <kbd>?</kbd> für alle Tastenkürzel</span>
      <span>Lern-App, keine Anlageberatung. Alle Kurse sind simuliert.</span>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="confetti" hidden></canvas>
<div id="modal"></div>

<script>
"use strict";
/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const main = $('#main');
const de = (n, d = 0) => Number(n).toLocaleString('de-DE', {minimumFractionDigits: d, maximumFractionDigits: d});
const eur = (n, d = 0) => (n < 0 ? '−' : '') + de(Math.abs(n), d) + ' €';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r){ let u = 0, v = 0; while(!u) u = r(); while(!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function shuffle(a, r = Math.random){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = (a, r = Math.random) => a[Math.floor(r() * a.length)];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dayStr = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

/* ---------- Saved progress (this browser only) ---------- */
const KEY = 'chartschule.v1';
const DEF = {xp: 0, streak: 0, bestStreak: 0, lastDay: null, goal: 30, freezes: 0, days: {}, met: {}, frozen: {}, streakLost: 0, mods: {}, blitzBest: 0, riskBest: 0, simDays: 0, simBestDisc: 0, simTotalR: 0, badges: {}, sound: true, quests: {date: null, done: {}}};
function load(){ try { return Object.assign(JSON.parse(JSON.stringify(DEF)), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){ return JSON.parse(JSON.stringify(DEF)); } }
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ---------- Levels, XP, streak, quests, badges ---------- */
const LV = [0, 100, 250, 450, 700, 1000, 1400, 1900, 2500, 3200, 4000];
const TITLES = ['Neuling', 'Chart-Gucker', 'Kerzenleser', 'Trendfolger', 'Risiko-Manager', 'Setup-Jäger', 'Tape-Reader', 'Disziplin-Profi', 'Markt-Stratege', 'Trading-Meister', 'Legende'];
function levelOf(xp){ let l = 0; while(l < LV.length - 1 && xp >= LV[l + 1]) l++; return l; }
function addXP(n, why){
  const before = levelOf(S.xp);
  S.xp += n;
  const t = dayStr(), had = S.days[t] || 0;
  S.days[t] = had + n;
  toast('+' + n + ' XP · ' + why, 'xp');
  if(had < S.goal && had + n >= S.goal) setTimeout(extendStreak, 500);
  const after = levelOf(S.xp);
  if(after > before){ setTimeout(() => { toast('Level ' + (after + 1) + ': ' + TITLES[after] + '!'); confetti(); sfx('level'); }, 400); }
  save(); renderStats();
}
/* ---------- Streak system ---------- */
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return dayStr(x); };
const dayDiff = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const MILESTONES = [3, 7, 14, 30, 50, 100, 200, 365];
const GOALS = [[15, 'Locker', 'etwa 1 Lektion'], [30, 'Normal', 'Lektion + Quiz'], [60, 'Ehrgeizig', 'Quiz + Spiele'], [100, 'Profi', 'volles Training']];
function goalMetToday(){ return !!S.met[dayStr()]; }
function checkStreak(){
  // Called on start: missed days use up a streak freeze or break the streak.
  if(!S.streak || !S.lastDay) return;
  const missed = dayDiff(S.lastDay, dayStr()) - 1;
  if(missed <= 0) return;
  if(S.freezes >= missed){
    for(let i = 1; i <= missed; i++) S.frozen[addDays(S.lastDay, i)] = true;
    S.freezes -= missed; S.lastDay = addDays(dayStr(), -1);
    S.pendingPop = {kind: 'frozen', n: missed};
  } else { S.streakLost = S.streak; S.streak = 0; S.pendingPop = {kind: 'lost', n: S.streakLost}; }
  save();
}
function extendStreak(){
  const t = dayStr();
  if(S.met[t]) return;
  S.met[t] = true;
  S.streak = S.lastDay === addDays(t, -1) ? S.streak + 1 : 1;
  S.lastDay = t; S.streakLost = 0;
  S.bestStreak = Math.max(S.bestStreak, S.streak);
  // prune history older than 120 days
  Object.keys(S.days).forEach(d => { if(dayDiff(d, t) > 120){ delete S.days[d]; delete S.met[d]; delete S.frozen[d]; } });
  let gotFreeze = false;
  if(S.streak % 7 === 0 && S.freezes < 2){ S.freezes++; gotFreeze = true; }
  save(); renderStats(); sfx('level');
  if(S.streak >= 3) award('streak3'); if(S.streak >= 7) award('streak7'); if(S.streak >= 14) award('streak14'); if(S.streak >= 30) award('streak30');
  if(MILESTONES.includes(S.streak)){ confetti(); showPop(`<div class="pop" style="display:grid;gap:14px">${flame(96, true)}<div class="streak-num num">${S.streak}</div><h2>${S.streak} Tage in Folge!</h2><p class="muted" style="max-width:40ch">Meilenstein geschafft. Genau so baut man Gewohnheiten auf, und Gewohnheiten schlagen Motivation.${gotFreeze ? ' Du bekommst einen Serienschutz dazu.' : ''}</p><button class="btn pri big" data-act="closepop">Weiter <kbd>Enter</kbd></button></div>`); }
  else toast('Tagesziel erreicht! Serie: ' + S.streak + (S.streak === 1 ? ' Tag' : ' Tage') + (gotFreeze ? ' · +1 Serienschutz' : ''));
  if(V.name === 'home') home(); else if(V.name === 'profile') profile();
}
function flame(size, lit){
  return `<svg class="flame ${lit ? 'lit' : ''}" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z" fill="${lit ? 'var(--accent)' : 'var(--line)'}"/><path d="M12 12c.6 2 3 3 3 5.5a3 3 0 0 1-6 0c0-1.5 1-2.5 1.5-3 .2 1 .6 1.5 1.2 1.5-.2-1.5-.4-2.8.3-4z" fill="${lit ? 'var(--down)' : 'var(--surface-2)'}" opacity=".85"/></svg>`;
}
const SNOW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M4 6l16 12M20 6L4 18M9 3l3 3 3-3M9 21l3-3 3 3"/></svg>';
function weekRow(){
  const t = dayStr(), now = new Date(t + 'T12:00:00'), mon = addDays(t, -((now.getDay() + 6) % 7));
  return `<div class="week">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map((n, i) => { const d = addDays(mon, i), cls = S.met[d] ? 'met' : S.frozen[d] ? 'frz' : d === t ? 'today' : d > t ? 'fut' : '';
    return `<div style="display:grid;gap:4px"><span>${n}</span><i class="dot ${cls}" title="${d}">${S.met[d] ? I.check : S.frozen[d] ? SNOW : ''}</i></div>`; }).join('')}</div>`;
}
function streakCard(){
  const t = dayStr(), xp = S.days[t] || 0, met = goalMetToday(), pct = clamp(xp / S.goal * 100, 0, 100);
  const status = met ? `<div class="okline">Tagesziel geschafft. Deine Serie ist für heute sicher.</div>`
    : S.streak ? `<div class="risk">Noch ${S.goal - xp} XP heute, sonst ${S.freezes ? 'kostet es einen Serienschutz' : 'reißt deine Serie'}.</div>`
    : S.streakLost ? `<div class="risk">Deine Serie von ${S.streakLost} Tagen ist gerissen. Hol dir heute ${S.goal} XP und starte neu.</div>`
    : `<div class="why">Sammle heute ${S.goal} XP und starte deine erste Serie.</div>`;
  return `<section class="card streak"><div class="streak-top">${flame(64, met)}<div style="flex:1"><div class="streak-num num">${S.streak}</div><span class="eyebrow">${S.streak === 1 ? 'Tag' : 'Tage'} in Folge · Rekord ${S.bestStreak}</span></div>
    <div style="text-align:right"><span class="chip" title="Serienschutz" style="color:var(--info)"><span style="width:16px;height:16px;display:inline-grid">${SNOW}</span><b class="num">${S.freezes}/2</b></span></div></div>
    <div style="display:grid;gap:6px"><div class="lvl" style="font-size:14px"><b style="font-size:14px">Tagesziel</b><span class="num">${Math.min(xp, S.goal)} / ${S.goal} XP</span></div><div class="bar" style="height:10px"><i style="width:${pct}%"></i></div></div>
    ${weekRow()}${status}</section>`;
}

/* ---------- Feedback: toast, sound, confetti ---------- */
function toast(msg, cls = ''){ const el = document.createElement('div'); el.className = 'toast ' + cls; el.textContent = msg; const box = $('#toasts'); box.appendChild(el); while(box.children.length > 3) box.firstChild.remove(); setTimeout(() => el.remove(), 2600); }
let AC = null;
function sfx(kind){
  if(!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = {ok: [[660, .07], [880, .09]], no: [[220, .16]], level: [[523, .08], [659, .08], [784, .08], [1047, .16]], tick: [[1200, .02]], win: [[784, .07], [988, .12]], loss: [[300, .1], [240, .14]]}[kind] || [[440, .05]];
    let t = AC.currentTime;
    seq.forEach(([f, d]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = kind === 'no' || kind === 'loss' ? 'sawtooth' : 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02); t += d * .9; });
  } catch(e){}
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confetti'), x = c.getContext('2d'); c.hidden = false;
  const W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio;
  const cols = [css('--accent'), css('--up'), css('--down'), css('--info')];
  const P = Array.from({length: 140}, () => ({x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 26, vy: -Math.random() * 26 - 6, s: (Math.random() * 8 + 5) * devicePixelRatio, c: pick(cols), r: Math.random() * 6}));
  let f = 0;
  (function loop(){ x.clearRect(0, 0, W, H); P.forEach(p => { p.vy += .9; p.x += p.vx; p.y += p.vy; p.r += .2; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }); if(++f < 90) requestAnimationFrame(loop); else c.hidden = true; })();
}

/* ---------- Candle drawings (SVG, theme-aware) ---------- */
function candleSVG(cs, o = {}){
  const w = o.w || 360, h = o.h || 190, pad = 16;
  let vals = cs.flatMap(c => [c[1], c[2]]);
  (o.lines || []).forEach(l => vals.push(l.v));
  (o.over || []).forEach(l => vals.push(...l.pts.filter(v => v != null)));
  const lo = Math.min(...vals), hi = Math.max(...vals), rgt = o.lines && o.lines.some(l => l.t) ? 74 : 0;
  const n = cs.length, step = (w - pad * 2 - rgt) / n, bw = Math.max(3, Math.min(22, step * .62));
  const y = v => pad + (hi - v) / ((hi - lo) || 1) * (h - pad * 2);
  const X = i => pad + step * i + step / 2;
  let s = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${o.label || 'Kerzenchart'}">`;
  (o.hl || []).forEach(i => { s += `<rect x="${X(i) - step / 2 + 1}" y="4" width="${step - 2}" height="${h - 8}" rx="6" fill="var(--accent)" opacity=".16"/>`; });
  (o.box || []).forEach(b => { s += `<rect x="${X(b.a) - step / 2}" y="${y(b.hi)}" width="${step * (b.b - b.a + 1)}" height="${y(b.lo) - y(b.hi)}" fill="var(--info)" opacity=".1"/>`; });
  (o.lines || []).forEach(l => { s += `<line x1="${pad}" x2="${w - pad - rgt + (rgt ? 6 : 0)}" y1="${y(l.v)}" y2="${y(l.v)}" stroke="var(${l.c || '--muted'})" stroke-width="1.6" stroke-dasharray="${l.solid ? '' : '5 4'}"/>`; if(l.t) s += `<text x="${w - rgt + 2}" y="${y(l.v) + 4}" font-size="12" font-weight="700" fill="var(${l.c || '--muted'})" font-family="Figtree,sans-serif">${l.t}</text>`; });
  cs.forEach((c, i) => { const up = c[3] >= c[0], col = up ? 'var(--up)' : 'var(--down)', top = y(Math.max(c[0], c[3])), bh = Math.max(1.5, Math.abs(y(c[0]) - y(c[3]))); s += `<line x1="${X(i)}" x2="${X(i)}" y1="${y(c[1])}" y2="${y(c[2])}" stroke="${col}" stroke-width="1.6"/><rect x="${X(i) - bw / 2}" y="${top}" width="${bw}" height="${bh}" rx="1.5" fill="${col}"/>`; });
  (o.over || []).forEach(l => { const pts = l.pts.map((v, i) => v == null ? null : X(i) + ',' + y(v)).filter(Boolean).join(' '); s += `<polyline points="${pts}" fill="none" stroke="var(${l.c})" stroke-width="2.4" stroke-linejoin="round"/>`; });
  (o.marks || []).forEach(m => { const yy = y(m.v); s += `<path d="M${X(m.i)} ${yy + (m.up ? 8 : -8)} l-6 ${m.up ? 10 : -10} h12z" fill="var(--accent)"/>`; });
  return s + '</svg>';
}
function series(closes, seed = 7, wick = .35){ const r = rng(seed); return closes.map((c, i) => { const o = i ? closes[i - 1] + (r() - .5) * .15 : c - .3; return [o, Math.max(o, c) + r() * wick, Math.min(o, c) - r() * wick, c]; }); }
function zz(pts, per, seed = 3, noise = .25){ const r = rng(seed), out = []; for(let i = 0; i < pts.length - 1; i++) for(let k = 0; k < per; k++) out.push(pts[i] + (pts[i + 1] - pts[i]) * (k / per) + (r() - .5) * noise); out.push(pts[pts.length - 1]); return out; }
function emaArr(cs, n){ const a = 2 / (n + 1); let e = cs[0][3]; return cs.map((c, i) => (e = i ? c[3] * a + e * (1 - a) : c[3])); }

/* Pattern generator (shared by lessons and the Muster-Blitz) */
const PATTERNS = {
  hammer: {n: 'Hammer', d: 'Kleiner Körper oben, langer unterer Docht nach einem Abwärtstrend: Verkäufer wurden zurückgedrängt.'},
  star: {n: 'Shooting Star', d: 'Kleiner Körper unten, langer oberer Docht nach einem Anstieg: Käufer wurden abgewiesen.'},
  doji: {n: 'Doji', d: 'Open und Close fast gleich: Käufer und Verkäufer sind unentschlossen.'},
  bullE: {n: 'Bullish Engulfing', d: 'Grüne Kerze, deren Körper den roten Körper davor komplett umschließt.'},
  bearE: {n: 'Bearish Engulfing', d: 'Rote Kerze, deren Körper den grünen Körper davor komplett umschließt.'},
  inside: {n: 'Inside Bar', d: 'Hoch und Tief liegen komplett innerhalb der Vorkerze: Der Markt sammelt sich.'},
  maru: {n: 'Marubozu', d: 'Großer Körper fast ohne Dochte: Eine Seite hatte die volle Kontrolle.'}
};
function genPattern(type, r){
  const dir = {hammer: -1, bullE: -1, star: 1, bearE: 1}[type] || (r() < .5 ? 1 : -1);
  let p = 100; const cs = [];
  const pre = 7 + Math.floor(r() * 3);
  for(let i = 0; i < pre; i++){ const o = p, c = o + dir * (.5 + r() * .9) + (r() - .5) * 1.1; cs.push([o, Math.max(o, c) + r() * .5, Math.min(o, c) - r() * .5, c]); p = c; }
  let hl = 1;
  if(type === 'hammer'){ const o = p - .2, c = o + .45; cs.push([o, c + .08, o - 2.2 - r() * .6, c]); }
  else if(type === 'star'){ const o = p + .2, c = o - .45; cs.push([o, o + 2.2 + r() * .6, c - .08, c]); }
  else if(type === 'doji'){ const o = p + (r() - .5) * .3; cs.push([o, o + .9 + r() * .5, o - .9 - r() * .5, o + .03]); }
  else if(type === 'bullE' || type === 'bearE'){ const s = type === 'bullE' ? 1 : -1; const o1 = p, c1 = p - s * (.7 + r() * .3); cs.push([o1, Math.max(o1, c1) + .15, Math.min(o1, c1) - .15, c1]); const o2 = c1 - s * .15, c2 = o1 + s * (.5 + r() * .5); cs.push([o2, Math.max(o2, c2) + .12, Math.min(o2, c2) - .12, c2]); hl = 2; }
  else if(type === 'inside'){ const o1 = p, c1 = p + dir * (2.2 + r() * .6); const h1 = Math.max(o1, c1) + .3, l1 = Math.min(o1, c1) - .3; cs.push([o1, h1, l1, c1]); const m = (o1 + c1) / 2, o2 = m + .3 * dir, c2 = m - .3 * dir; cs.push([o2, Math.max(o2, c2) + .35, Math.min(o2, c2) - .35, c2]); hl = 2; }
  else if(type === 'maru'){ const o = p, c = p + dir * (2.4 + r() * .8); cs.push([o, Math.max(o, c) + .02, Math.min(o, c) - .02, c]); }
  const n = cs.length; return {cs, hl: hl === 2 ? [n - 2, n - 1] : [n - 1]};
}
function patFig(type, seed = 11, w = 360, h = 190){ const g = genPattern(type, rng(seed)); return candleSVG(g.cs, {hl: g.hl, w, h, label: PATTERNS[type].n}); }

  ema: () => { const cs = series(zz([10, 13, 12, 15, 14, 17], 4, 41), 13); return candleSVG(cs, {w: 420, h: 190, over: [{pts: emaArr(cs, 9), c: '--info'}]}); },
  rr: () => candleSVG(series([20, 20.4, 20.1, 20.6, 20.3, 20.8, 21.4, 21.1, 21.8, 22.3], 6, .2), {w: 420, h: 200, lines: [{v: 22.4, t: 'Ziel +2R', c: '--up'}, {v: 20.6, t: 'Entry', c: '--ink', solid: true}, {v: 19.7, t: 'Stop −1R', c: '--down'}]}),
  orb: () => { const c = series([30, 31.2, 30.4, 31, 30.6, 30.9, 31.3, 31.8, 32.4, 32.1, 32.9, 33.4], 51, .4); return candleSVG(c, {w: 420, h: 190, box: [{a: 0, b: 5, hi: 31.6, lo: 29.8}], lines: [{v: 31.6, t: 'OR-Hoch', c: '--up'}, {v: 29.8, t: 'OR-Tief', c: '--down'}], hl: [7]}); },

  flag: () => candleSVG(series([10, 10.8, 11.9, 13.2, 14.4, 14.1, 13.9, 13.7, 13.6, 14.6, 15.6, 16.4], 71, .25), {w: 420, h: 190, hl: [9], lines: [{v: 14.5, t: 'Flaggen-Hoch', c: '--muted'}]}),
  pullback: () => { const cs = series([10, 10.6, 11.3, 12, 12.6, 12.2, 11.9, 12.1, 12.8, 13.5, 14.1, 13.7, 13.6, 14.3, 15], 81, .25); return candleSVG(cs, {w: 420, h: 190, over: [{pts: emaArr(cs, 9), c: '--info'}], hl: [6, 12]}); }

const MODS = [
 {id: 'm1', t: 'Grundlagen', sub: 'Märkte, Spread, Ordertypen, Long & Short', cards: [
  {h: 'Was ist Day Trading?', b: `<p>Beim Day Trading öffnest und schließt du Positionen <b>am selben Handelstag</b>. Über Nacht hältst du nichts. Du versuchst, kleine, wiederholbare Kursbewegungen auszunutzen.</p><div class="warn">Die Wahrheit vorweg: In einer großen Studie aus Brasilien verloren <b>97 %</b> der Daytrader, die über 300 Tage dabeiblieben, Geld. Deshalb lernst du hier nicht nur Muster, sondern vor allem <b>Risiko und Disziplin</b>.</div>`},
  {h: 'Was wird gehandelt?', b: `<ul><li><b>Aktien</b>: Anteile an Firmen, z. B. Apple oder SAP.</li><li><b>Futures</b>: Terminkontrakte auf Indizes wie DAX oder S&amp;P 500.</li><li><b>Forex</b>: Währungspaare wie EUR/USD.</li><li><b>CFDs &amp; Hebelprodukte</b>: mit Hebel. Gewinne <i>und</i> Verluste werden vervielfacht.</li></ul><p>Fürs Day Trading zählen zwei Dinge: <b>Liquidität</b> (viele Käufer und Verkäufer) und <b>Volatilität</b> (der Kurs bewegt sich genug).</p>`},
  {h: 'Bid, Ask und Spread', fig: 'book', b: `<p>Der <b>Bid</b> ist der höchste Preis, den ein Käufer gerade bietet. Der <b>Ask</b> ist der niedrigste Preis, zu dem jemand verkauft. Die Differenz heißt <b>Spread</b>.</p><p>Kaufst du sofort, zahlst du den Ask. Verkaufst du sofort, bekommst du den Bid. Der Spread ist also bei jedem Trade deine erste Gebühr.</p>`},
  {h: 'Die drei wichtigsten Ordertypen', b: `<ul><li><b>Market-Order</b>: sofort ausführen, zum nächsten verfügbaren Preis. Schnell, aber mit Risiko auf <i>Slippage</i> (schlechterer Preis als gedacht).</li><li><b>Limit-Order</b>: nur zu deinem Preis oder besser. Du bestimmst den Preis, aber sie wird vielleicht nie ausgeführt.</li><li><b>Stop-Order</b>: schlummert, bis ein Preis erreicht wird, und wird dann zur Market-Order. Als <b>Stop-Loss</b> ist sie dein Notausgang.</li></ul>`},
  {h: 'Long und Short', fig: 'longshort', b: `<p><b>Long</b> heißt: Du kaufst und willst, dass der Kurs steigt. <b>Short</b> heißt: Du verkaufst zuerst (geliehen) und willst, dass der Kurs fällt. Später kaufst du günstiger zurück.</p><p>Als Daytrader kannst du in beide Richtungen Geld verdienen. Und verlieren.</p>`}

  {q: 'Du willst sofort rein, der genaue Preis ist dir egal. Welche Order?', a: ['Market-Order', 'Limit-Order', 'Stop-Loss', 'Gar keine'], why: 'Die Market-Order wird sofort zum besten verfügbaren Preis ausgeführt.'},
  {q: 'Was bedeutet „short gehen“?', a: ['Auf fallende Kurse setzen', 'Eine Aktie nur kurz halten', 'Mit wenig Geld handeln', 'Nur Gewinne mitnehmen'], why: 'Short = verkaufen und später günstiger zurückkaufen.'},

 ]},
 {id: 'm2', t: 'Kerzencharts', sub: 'OHLC, Körper, Dochte, Zeiteinheiten, Volumen', cards: [
  {h: 'Eine Kerze erzählt eine Geschichte', fig: 'anatomy', b: `<p>Jede Kerze fasst einen Zeitraum zusammen, mit vier Preisen: <b>Open, High, Low, Close</b> (kurz OHLC). Grün heißt: Close liegt über Open. Rot heißt: Close liegt unter Open.</p>`},
  {h: 'Körper und Dochte lesen', fig: 'wicks', b: `<ul><li><b>Großer Körper</b>: eine Seite hat klar gewonnen.</li><li><b>Langer oberer Docht</b>: Der Preis war oben, wurde aber wieder runtergedrückt. Verkäufer haben abgelehnt.</li><li><b>Langer unterer Docht</b>: Käufer haben tiefe Preise abgelehnt.</li><li><b>Winziger Körper</b>: Unentschlossenheit.</li></ul>`},
  {h: 'Zeiteinheiten', b: `<p>Eine 5-Minuten-Kerze zeigt 5 Minuten Handel, eine 1-Minuten-Kerze eine Minute. Viele Daytrader suchen Setups auf dem <b>5-Minuten-Chart</b> und timen den Einstieg auf dem <b>1-Minuten-Chart</b>.</p><p>Faustregel: Der höhere Zeitrahmen gibt die Richtung vor, der niedrigere den Einstieg.</p>`},
  {h: 'Volumen: die Wahrheitsprobe', b: `<p>Volumen zeigt, wie viele Stück gehandelt wurden. Eine Bewegung mit <b>hohem Volumen</b> hat echte Beteiligung. Ein Ausbruch mit wenig Volumen ist verdächtig und scheitert öfter.</p><p>Am meisten Volumen gibt es meist zur <b>Markteröffnung</b> und kurz vor <b>Handelsschluss</b>. Mittags wird es ruhig.</p>`}
 ], quiz: [

  {q: 'Eine grüne Kerze bedeutet …', a: ['Close liegt über Open', 'Der Kurs ist heute gestiegen', 'Hohes Volumen', 'Close liegt unter Open'], why: 'Die Farbe vergleicht Close mit Open der gleichen Kerze.'},

  {q: 'Was zeigt eine 5-Minuten-Kerze?', a: ['Den Handel von 5 Minuten', 'Fünf Trades', 'Die letzten 5 Tage', 'Fünf Prozent Bewegung'], why: 'Jede Kerze steht für genau ihren Zeitraum.'},
  {q: 'Ein Ausbruch passiert mit sehr hohem Volumen. Das ist …', a: ['glaubwürdiger als mit niedrigem Volumen', 'ein sicheres Verkaufssignal', 'bedeutungslos', 'immer ein Fakeout'], why: 'Volumen bestätigt, dass viele Teilnehmer die Bewegung tragen.'}
 ]},
 {id: 'm3', t: 'Kerzenmuster', sub: 'Doji, Hammer, Shooting Star, Engulfing, Inside Bar', cards: [
  {h: 'Doji: Unentschlossenheit', fig: 'doji', b: `<p>Open und Close liegen fast gleich, oft mit Dochten auf beiden Seiten. Allein bedeutet ein Doji wenig. <b>Nach einem starken Trend</b> kann er zeigen, dass die Kraft nachlässt.</p>`},
  {h: 'Hammer und Shooting Star', fig: 'hammer', b: `<p>Der <b>Hammer</b> hat einen kleinen Körper oben und einen langen unteren Docht (mindestens doppelt so lang wie der Körper). Nach einem Abwärtstrend zeigt er: Verkäufer wurden zurückgeschlagen.</p><p>Der <b>Shooting Star</b> ist das Spiegelbild: langer oberer Docht nach einem Anstieg.</p>`},
  {h: 'Engulfing: die Übernahme', fig: 'bullE', b: `<p>Beim <b>Bullish Engulfing</b> umschließt der grüne Körper den roten Körper davor komplett. Die Käufer haben in einer Kerze alles zurückerobert. <b>Bearish Engulfing</b> ist das Gegenteil.</p>`},
  {h: 'Inside Bar und Marubozu', fig: 'inside', b: `<p>Die <b>Inside Bar</b> liegt mit Hoch und Tief komplett in der Vorkerze. Der Markt sammelt Energie. Ein Ausbruch über das Hoch oder unter das Tief ist ein häufiger Trigger.</p><p>Der <b>Marubozu</b> ist ein großer Körper fast ohne Dochte: eine Seite hatte die volle Kontrolle.</p>`},

 ], quiz: [

  {q: 'Was signalisiert eine Inside Bar?', a: ['Kompression: oft folgt ein Ausbruch', 'Das sichere Ende des Trends', 'Extrem hohes Volumen', 'Einen Gap'], why: 'Die Spanne zieht sich zusammen, danach wird es oft schnell.'}

 {id: 'm4', t: 'Trend & Struktur', sub: 'Hochs und Tiefs, Support, Widerstand, Ausbrüche', cards: [
  {h: 'Was ist ein Trend?', fig: 'trendUp', b: `<p>Ein <b>Aufwärtstrend</b> besteht aus <b>höheren Hochs und höheren Tiefs</b>. Ein Abwärtstrend aus tieferen Hochs und tieferen Tiefs. Solange die Struktur hält, gilt der Trend.</p><div class="formula">„The trend is your friend“: Handle mit dem Trend, nicht dagegen.</div>`},
  {h: 'Support und Widerstand', fig: 'range', b: `<p><b>Support</b> ist eine Zone, an der Käufer wiederholt eingestiegen sind. <b>Widerstand</b> eine Zone, an der Verkäufer gedrückt haben. Dazwischen läuft der Kurs seitwärts: eine <b>Range</b>.</p><p>Wichtige Intraday-Level: Vortageshoch und -tief, Tageseröffnung, runde Zahlen, Prämarkt-Hoch und -Tief.</p>`},
  {h: 'Ausbruch', fig: 'breakout', b: `<p>Ein <b>Breakout</b> passiert, wenn der Kurs ein Level mit Kraft und Volumen durchbricht. Danach wird alter Widerstand oft zu neuem Support (<i>Rollentausch</i>).</p><p>Ein logischer Stop liegt <b>unter dem Ausbruchslevel</b>: Fällt der Kurs zurück, war die Idee falsch.</p>`},
  {h: 'Fakeout: die Falle', fig: 'fakeout', b: `<p>Nicht jeder Ausbruch hält. Beim <b>Fakeout</b> sticht der Kurs kurz über das Level und fällt dann zurück in die Range. Wer zu früh gekauft hat, sitzt in der Falle.</p><p>Schutz: auf den <b>Schlusskurs</b> der Kerze warten, Volumen prüfen und immer einen Stop setzen.</p>`}
 ], quiz: [
  {q: 'Woran erkennst du einen Aufwärtstrend?', a: ['Höhere Hochs und höhere Tiefs', 'Viele grüne Kerzen am Stück', 'RSI über 50', 'Ein Gap nach oben'], why: 'Die Struktur aus Hochs und Tiefs definiert den Trend.'},
  {q: 'Ein klar gebrochener Widerstand wird oft zu …', a: ['Support', 'einem stärkeren Widerstand', 'gar nichts', 'einem Doji'], why: 'Rollentausch: Alter Widerstand dient danach oft als Unterstützung.'},
  {q: 'Was ist ein Fakeout?', a: ['Ein Ausbruch, der schnell in die Range zurückfällt', 'Ein besonders starker Trend', 'Eine gefälschte Order', 'Ein Gap beim Open'], why: 'Der Ausbruch hält nicht und fängt späte Käufer.'},
  {q: 'Wie handelst du in einer Range eher?', a: ['Kaufen nahe Support, verkaufen nahe Widerstand', 'Kaufen am Widerstand', 'Mitten in der Range einsteigen', 'Ranges ignorieren, dort ist es sicher'], why: 'An den Rändern ist das Chance-Risiko-Verhältnis am besten.'},
  {q: 'Wo liegt ein logischer Stop für einen Long-Ausbruch?', a: ['Unter dem Ausbruchslevel', 'Weit über dem Entry', 'Gar kein Stop nötig', 'Genau auf dem Entry'], why: 'Fällt der Kurs wieder unter das Level, ist die Ausbruchsidee widerlegt.'}
 ]},
 {id: 'm5', t: 'Indikatoren', sub: 'VWAP, EMA, RSI und ihre Grenzen', cards: [
  {h: 'VWAP: der Tages-Kompass', fig: 'vwap', b: `<p>Der <b>VWAP</b> (volumengewichteter Durchschnittspreis) zeigt, wo heute im Schnitt gehandelt wurde. Er startet jeden Morgen neu.</p><ul><li>Kurs <b>über</b> VWAP: Käufer haben die Kontrolle. Eher long denken.</li><li>Kurs <b>unter</b> VWAP: Verkäufer haben die Kontrolle. Eher short denken.</li></ul><p>Große Fonds nutzen den VWAP als Benchmark. Deshalb reagiert der Kurs oft an dieser Linie.</p>`},
  {h: 'EMA 9 und EMA 20', fig: 'ema', b: `<p>Der <b>exponentielle gleitende Durchschnitt</b> (EMA) glättet den Kurs und gewichtet neue Kerzen stärker als ein einfacher Durchschnitt (SMA). Er reagiert dadurch schneller.</p><p>Im Trend laufen Kurse oft an der EMA 9 oder EMA 20 entlang. Rücksetzer dorthin sind beliebte Einstiege.</p>`},
  {h: 'RSI: überkauft, überverkauft', b: `<p>Der <b>RSI</b> misst von 0 bis 100, wie stark die jüngsten Gewinne im Vergleich zu den Verlusten waren. Über 70 gilt als <b>überkauft</b>, unter 30 als <b>überverkauft</b>.</p><div class="warn">Achtung: In starken Trends bleibt der RSI lange über 70. „Überkauft“ ist kein Verkaufssignal für sich.</div>`},
  {h: 'Indikatoren hinken hinterher', b: `<p>Alle Indikatoren werden aus <b>vergangenen</b> Kursen berechnet. Sie sagen nichts voraus, sie fassen zusammen. Nutze wenige, verstehe sie gut und lass den Preis selbst entscheiden.</p><div class="formula">Preis &amp; Volumen zuerst · Indikatoren als Bestätigung</div>`}
 ], quiz: [
  {q: 'Was ist der VWAP?', a: ['Der volumengewichtete Durchschnittspreis des Tages', 'Der Vortagesschluss', 'Der höchste Preis des Tages', 'Ein Kerzenmuster'], why: 'Er gewichtet jeden Preis mit dem gehandelten Volumen.'},
  {q: 'Der Kurs liegt den ganzen Vormittag über dem VWAP. Das heißt meistens …', a: ['Käufer haben die Kontrolle', 'Short ist die bessere Idee', 'Der Kurs fällt gleich', 'Gar nichts'], why: 'Über dem VWAP haben Käufer im Schnitt im Plus.'},
  {q: 'Was stimmt beim RSI über 70?', a: ['In starken Trends kann er lange dort bleiben', 'Du musst sofort short gehen', 'Der Kurs fällt garantiert', 'Er zeigt das Volumen'], why: 'Überkauft heißt nicht „gleich vorbei“.'},
  {q: 'Warum reagiert die EMA schneller als die SMA?', a: ['Neue Kurse werden stärker gewichtet', 'Sie nutzt mehr Kerzen', 'Sie ignoriert Dochte', 'Sie nutzt das Volumen'], why: 'Exponentielle Gewichtung bevorzugt aktuelle Preise.'},
  {q: 'Warum sind Indikatoren „nachlaufend“?', a: ['Sie werden aus vergangenen Kursen berechnet', 'Sie werden verzögert angezeigt', 'Sie funktionieren nur abends', 'Sie sind kostenpflichtig'], why: 'Ein Indikator fasst Vergangenes zusammen.'}
 ]},
 {id: 'm6', t: 'Risikomanagement', sub: '1-%-Regel, Positionsgröße, CRV, Erwartungswert', cards: [
  {h: 'Die 1-%-Regel', b: `<p>Riskiere pro Trade höchstens <b>1 % deines Kontos</b>. Bei 10.000 € sind das 100 €. Klingt wenig? Genau das ist der Punkt.</p><p>Selbst 10 Verluste in Folge kosten dich dann nur rund 10 %. Mit 10 % Risiko pro Trade wärst du nach so einer Serie fast pleite.</p><div class="formula">Überleben kommt vor Gewinnen.</div>`},
  {h: 'Positionsgröße berechnen', b: `<p>Nicht das Bauchgefühl bestimmt die Stückzahl, sondern dein Stop:</p><div class="formula">Stück = (Konto × Risiko %) ÷ (Entry − Stop)</div><p>Beispiel: Konto 20.000 €, Risiko 1 % = 200 €. Entry 50 €, Stop 49 € → 1 € Risiko pro Aktie → <b>200 Aktien</b>.</p><p>Weiter Stop = weniger Aktien. Enger Stop = mehr Aktien. Das Risiko in Euro bleibt gleich.</p>`},
  {h: 'Wo gehört der Stop hin?', fig: 'rr', b: `<p>Der Stop liegt dort, wo <b>deine Idee widerlegt ist</b>: unter dem letzten Tief, unter dem Ausbruchslevel, unter dem VWAP. Nicht bei einem zufälligen Eurobetrag.</p><p>Und: Einen Stop verschiebt man nur <b>in deine Richtung</b>, nie weiter weg.</p>`},
  {h: 'Chance-Risiko-Verhältnis (CRV)', b: `<p>Das CRV vergleicht möglichen Gewinn mit möglichem Verlust. Entry 100, Stop 98, Ziel 106 → 6 € Chance zu 2 € Risiko = <b>3:1</b>. Trader sagen auch: Das Ziel liegt bei <b>3R</b>.</p><div class="formula">Break-even-Trefferquote = 1 ÷ (1 + CRV)</div><p>Bei 2:1 reicht eine Trefferquote von rund 33 %, um nicht zu verlieren (ohne Gebühren).</p>`},
  {h: 'Erwartungswert und Tageslimit', b: `<div class="formula">E = Trefferquote × Ø Gewinn − Verlustquote × Ø Verlust</div><p>Beispiel: 40 % Treffer à 200 €, 60 % Verluste à 100 € → E = 80 − 60 = <b>+20 € pro Trade</b>. Eine Strategie mit positivem Erwartungswert gewinnt über viele Trades, nicht bei jedem.</p><p>Setz dir ein <b>Tagesverlustlimit</b> (z. B. 3R). Erreicht? Feierabend. Ohne Diskussion.</p>`}
 ], quiz: [
  {q: 'Konto 10.000 €, 1 % Risiko pro Trade. Wie viel darfst du verlieren?', a: ['100 €', '1.000 €', '10 €', '1 €'], why: '1 % von 10.000 € = 100 €.'},
  {q: 'Konto 20.000 €, 1 % Risiko, Entry 50 €, Stop 49 €. Wie viele Aktien?', a: ['200', '400', '20', '100'], why: '200 € Risiko ÷ 1 € pro Aktie = 200 Aktien.'},
  {q: 'Entry 100, Stop 98, Ziel 106. Welches CRV?', a: ['3:1', '2:1', '6:1', '1:3'], why: 'Chance 6 ÷ Risiko 2 = 3.'},
  {q: 'Bei einem CRV von 2:1 liegt die Break-even-Trefferquote bei etwa …', a: ['33 %', '50 %', '66 %', '20 %'], why: '1 ÷ (1 + 2) ≈ 33 %.'},
  {q: 'Dein Tagesverlustlimit ist erreicht. Was tust du?', a: ['Für heute aufhören', 'Doppelte Größe, um es zurückzuholen', 'Den Stop entfernen', 'Auf einen anderen Markt wechseln'], why: 'Das Limit schützt dich vor deinem schlechtesten Tag und vor Revenge-Trades.'}
 ]},
 {id: 'm7', t: 'Setups', sub: 'Opening Range, VWAP-Reclaim, Bull Flag, Pullback', cards: [
  {h: 'Opening Range Breakout (ORB)', fig: 'orb', b: `<p>Markiere Hoch und Tief der ersten 15 bis 30 Minuten. Schließt eine Kerze mit Volumen <b>über dem Hoch</b>, ist das ein Long-Trigger. Unter dem Tief entsprechend short.</p><ul><li><b>Entry</b>: Schluss über dem OR-Hoch</li><li><b>Stop</b>: Mitte der Range oder unter dem Ausbruchstief</li><li><b>Ziel</b>: 2R oder nächstes Level</li></ul>`},

function drawHero(){
  const c = $('#heroc'); if(!c) return;
  const w = c.clientWidth, h = c.clientHeight; c.width = w * devicePixelRatio; c.height = h * devicePixelRatio;
  const x = c.getContext('2d'); x.scale(devicePixelRatio, devicePixelRatio);
  const r = rng(42 + S.xp), n = Math.max(16, Math.floor(w / 14)); let p = 50; const cs = [];
  for(let i = 0; i < n; i++){ const o = p, cl = o + (r() - .42) * 3; cs.push([o, Math.max(o, cl) + r() * 1.2, Math.min(o, cl) - r() * 1.2, cl]); p = cl; }
  const lo = Math.min(...cs.map(k => k[2])), hi = Math.max(...cs.map(k => k[1])), Y = v => 6 + (hi - v) / (hi - lo) * (h - 12), st = w / n;
  cs.forEach((k, i) => { const col = k[3] >= k[0] ? css('--up') : css('--down'); x.strokeStyle = x.fillStyle = col; x.globalAlpha = .35 + .65 * (i / n); x.beginPath(); x.moveTo(i * st + st / 2, Y(k[1])); x.lineTo(i * st + st / 2, Y(k[2])); x.stroke(); x.fillRect(i * st + st * .2, Y(Math.max(k[0], k[3])), st * .6, Math.max(1.5, Math.abs(Y(k[0]) - Y(k[3])))); });
  x.globalAlpha = 1;
}

/* ---------- Views: Lesson + Quiz player ---------- */
let P = null;
function player(arg){
  V.nav = false;
  const m = MODS.find(x => x.id === arg.id);
  P = {m, phase: arg.quiz ? 'quiz' : 'learn', i: 0, score: 0, picked: null, qs: m.quiz.map(q => { const order = shuffle(q.a.map((_, i) => i)); return {q: q.q, a: order.map(i => q.a[i]), c: order.indexOf(0), why: q.why}; })};
  renderPlayer();
  V.key = (k) => {
    if(k === 'Escape'){ go('path'); return true; }
    if(P.phase === 'learn'){ if(k === 'ArrowRight' || k === 'Enter' || k === ' '){ pNext(); return true; } if(k === 'ArrowLeft'){ pPrev(); return true; } }
    else if(P.phase === 'quiz'){ if(/^[1-4]$/.test(k) && P.picked == null){ pAnswer(+k - 1); return true; } if((k === 'Enter' || k === ' ' || k === 'ArrowRight') && P.picked != null){ pNext(); return true; } }
    else if(P.phase === 'result'){ if(k === 'Enter'){ resultContinue(); return true; } }
  };
}

     <p class="muted">${pass ? (nm ? 'Als Nächstes: ' + nm.t + '.' : 'Du hast den kompletten Lernpfad abgeschlossen!') : 'Lies die Karten nochmal kurz durch, dann klappt es.'}</p>

/* ---------- Simulator ---------- */
let SIM = null;
const REGIME = {trendUp: 'Trendtag aufwärts', trendDown: 'Trendtag abwärts', range: 'Seitwärtstag (Range)', reversalUp: 'Umkehrtag: erst runter, dann rauf', reversalDown: 'Umkehrtag: erst rauf, dann runter'};
function genDay(seed){
  const r = rng(seed), N = 78, regime = pick(Object.keys(REGIME), r);
  const open = Math.round((25 + r() * 175) * 100) / 100, sd = open * .0021;
  let p = open; const cs = [];
  for(let i = 0; i < N; i++){
    const m = 1 + 1.3 * Math.exp(-i / 7) + .5 * Math.max(0, (i - 64) / 14);
    let d = 0;
    if(regime === 'trendUp') d = sd * .3; else if(regime === 'trendDown') d = -sd * .3;
    else if(regime === 'range') d = -(p - open) * .09;
    else if(regime === 'reversalUp') d = i < 28 ? -sd * .35 : sd * .38; else d = i < 28 ? sd * .35 : -sd * .38;
    const o = p; let h = o, l = o, c = o;
    for(let k = 0; k < 10; k++){ c += d / 10 + gauss(r) * sd * m / Math.sqrt(10); h = Math.max(h, c); l = Math.min(l, c); }
    p = c;
    cs.push({o, h, l, c, v: Math.round((800 + r() * 700) * m * (1 + Math.abs(c - o) / sd * .35)) * 10});
  }
  let cpv = 0, cv = 0, ema = cs[0].c, ag = 0, al = 0;
  cs.forEach((k, i) => {
    const tp = (k.h + k.l + k.c) / 3; cpv += tp * k.v; cv += k.v; k.vwap = cpv / cv;
    ema = i ? k.c * .2 + ema * .8 : k.c; k.ema = ema;
    k.tr = i ? Math.max(k.h - k.l, Math.abs(k.h - cs[i - 1].c), Math.abs(k.l - cs[i - 1].c)) : k.h - k.l;
    const s = cs.slice(Math.max(0, i - 13), i + 1); k.atr = s.reduce((a, b) => a + b.tr, 0) / s.length;
    if(i){ const ch = k.c - cs[i - 1].c, g = Math.max(ch, 0), lo = Math.max(-ch, 0); if(i <= 14){ ag += g / 14; al += lo / 14; } else { ag = (ag * 13 + g) / 14; al = (al * 13 + lo) / 14; } }
    k.rsi = i < 14 ? 50 : (al === 0 ? 100 : 100 - 100 / (1 + ag / al));
    const vs = cs.slice(Math.max(0, i - 19), i + 1); k.vavg = vs.reduce((a, b) => a + b.v, 0) / vs.length;
  });
  const first = cs.slice(0, 6);
  return {cs, regime, N, orH: Math.max(...first.map(k => k.h)), orL: Math.min(...first.map(k => k.l))};
}
function newSim(){ SIM = {day: genDay(Math.floor(Math.random() * 1e9)), cur: 5, eq: 25000, start: 25000, riskPct: 1, pos: null, trades: [], notes: [], disc: 100, lastLoss: -99, playing: false, over: false, no: S.simDays + 1}; }
const fee = sh => Math.max(1, sh * .005);
function note(pts, txt){ SIM.disc = Math.max(0, SIM.disc - pts); SIM.notes.push({pts, txt, i: SIM.cur}); toast('Disziplin −' + pts + ': ' + txt); }
function ctx(){
  const d = SIM.day, k = d.cs[SIM.cur], prev = d.cs[Math.max(0, SIM.cur - 3)];
  return {k, aboveV: k.c > k.vwap, emaUp: k.ema > prev.ema, orUp: k.c > d.orH, orDn: k.c < d.orL, rsi: k.rsi, spike: k.v > k.vavg * 1.6};
}
function simEnter(side){
  if(!SIM || SIM.over) return;

  const k = SIM.day.cs[SIM.cur], c = ctx();
  const dist = Math.max(k.atr * 1.1, k.c * .0012), entry = k.c, riskE = SIM.eq * SIM.riskPct / 100;
  let sh = Math.floor(riskE / dist); sh = Math.min(sh, Math.floor(SIM.eq * 4 / entry));

  const n = SIM.trades.length + 1;

  if(side < 0 && c.aboveV && c.emaUp) note(10, 'Short gegen den Trend (über VWAP, EMA steigt)');

function simExit(price, why){

  else coachTxt = 'Gemischte Signale. Kein Trade ist auch eine Position.';
  if(c.rsi > 75) coachTxt += ' RSI sehr hoch: Long jetzt wäre spät.'; else if(c.rsi < 25) coachTxt += ' RSI sehr tief: Short jetzt wäre spät.';
  let html = `<div class="navrow"><div><span class="eyebrow">Uhrzeit</span><div class="num" style="font-size:26px;font-weight:700">${time(SIM.cur)}</div></div><div style="text-align:right"><span class="eyebrow">Kurs</span><div class="num" style="font-size:26px;font-weight:700">${de(k.c, 2)}</div></div></div>
   <dl class="kv"><dt>Konto</dt><dd>${eur(SIM.eq + (p ? (k.c - p.entry) * p.side * p.sh : 0))}</dd><dt>Heute</dt><dd style="color:var(${dayPnl >= 0 ? '--up' : '--down'})">${dayPnl >= 0 ? '+' : ''}${eur(dayPnl)}</dd><dt>Ergebnis in R</dt><dd>${tR >= 0 ? '+' : ''}${de(tR, 2)}R</dd><dt>Disziplin</dt><dd style="color:var(${SIM.disc >= 80 ? '--up' : SIM.disc >= 50 ? '--accent' : '--down'})">${SIM.disc}/100</dd></dl>`;
  if(SIM.over){
    const wins = SIM.trades.filter(t => t.R > 0).length;
    html += `<div class="coach" style="background:var(--accent-soft)"><h3>Handelsschluss</h3><p>Das war ein <b>${REGIME[d.regime]}</b>.</p><dl class="kv"><dt>Trades</dt><dd>${SIM.trades.length}</dd><dt>Trefferquote</dt><dd>${SIM.trades.length ? Math.round(wins / SIM.trades.length * 100) + ' %' : '–'}</dd><dt>Gesamt</dt><dd>${tR >= 0 ? '+' : ''}${de(tR, 2)}R</dd></dl>
      <p style="font-size:13px">${SIM.notes.length ? SIM.notes.map(n => (n.pts ? '−' + n.pts + ' · ' : '') + n.txt).join('<br>') : 'Keine Regelverstöße. Stark!'}</p><p style="font-size:13px" class="muted">Bewertet wird die Disziplin. Ein Verlusttag mit sauberen Regeln ist besser als ein Glückstag ohne Plan.</p></div>
      <button class="btn pri big" data-act="simnew">Nächster Tag <kbd>Enter</kbd></button><button class="btn" data-act="go" data-v="home">Fertig <kbd>Esc</kbd></button>`;
  } else {
    html += `<div><span class="eyebrow">Risiko pro Trade <kbd>R</kbd></span><div class="seg" style="margin-top:6px">${[.5, 1, 2].map(v => `<button class="${SIM.riskPct === v ? 'on' : ''}" data-act="simrisk" data-v="${v}">${de(v, v % 1 ? 1 : 0)} %</button>`).join('')}</div></div>`;
    if(p){ const R = (k.c - p.entry) * p.side * p.sh / p.riskE;
      html += `<div class="pos ${p.side > 0 ? 'long' : 'short'}"><div class="navrow"><b>${p.side > 0 ? 'Long' : 'Short'} · ${de(p.sh)} Stück</b><b class="num" style="color:var(${R >= 0 ? '--up' : '--down'})">${R >= 0 ? '+' : ''}${de(R, 2)}R</b></div><dl class="kv" style="margin-top:6px"><dt>Entry</dt><dd>${de(p.entry, 2)}</dd><dt>Stop${p.be ? ' (Einstand)' : ''}</dt><dd style="color:var(--down)">${de(p.stop, 2)}</dd><dt>Ziel (2R)</dt><dd style="color:var(--up)">${de(p.target, 2)}</dd><dt>Risiko</dt><dd>${eur(p.riskE)}</dd></dl></div>`;
    }
    html += `<div class="tbtns"><button class="btn up" data-act="simlong" ${p ? 'disabled' : ''}>Long <kbd>B</kbd></button><button class="btn down" data-act="simshort" ${p ? 'disabled' : ''}>Short <kbd>S</kbd></button>
      <button class="btn" data-act="simclose" ${p ? '' : 'disabled'}>Schließen <kbd>X</kbd></button><button class="btn" data-act="simbe" ${p ? '' : 'disabled'}>Stop → Einstand <kbd>E</kbd></button>
      <button class="btn ink" data-act="simstep">Nächste Kerze <kbd>␣</kbd></button><button class="btn" data-act="simplay">${SIM.playing ? 'Pause' : 'Abspielen'} <kbd>P</kbd></button></div>
      <div class="coach"><b>Coach</b><div class="chips"><span class="chip ${c.aboveV ? 'up' : 'down'}">${c.aboveV ? 'über' : 'unter'} VWAP</span><span class="chip ${c.emaUp ? 'up' : 'down'}">EMA ${c.emaUp ? 'steigt' : 'fällt'}</span><span class="chip ${c.orUp ? 'up' : c.orDn ? 'down' : ''}">${c.orUp ? 'über' : c.orDn ? 'unter' : 'in'} Opening Range</span><span class="chip ${c.rsi > 70 || c.rsi < 30 ? 'acc' : ''}">RSI ${Math.round(c.rsi)}</span>${c.spike ? '<span class="chip acc">Volumen-Spike</span>' : ''}</div><p>${coachTxt}</p></div>
      <p class="muted" style="font-size:12px">Stop automatisch bei ca. 1,1 × ATR, Ziel bei 2R. Stückzahl aus deinem Risiko berechnet. Gebühr 0,005 € je Aktie, mind. 1 €.</p>`;
  }
  if(SIM.trades.length) html += `<div><span class="eyebrow">Trades</span><div class="tlist" style="margin-top:6px">${SIM.trades.map(t => `<div><span>${t.side > 0 ? 'Long ' : 'Short'} ${time(t.i)}→${time(t.j)}</span><span style="color:var(${t.R >= 0 ? '--up' : '--down'})">${t.R >= 0 ? '+' : ''}${de(t.R, 2)}R</span></div>`).join('')}</div></div>`;
  side.innerHTML = html;
  drawSim();
}
function drawSim(){
  const cv = $('#simc'); if(!cv || !SIM) return;
  const W = cv.clientWidth, H = cv.clientHeight; if(!W || !H) return;
  cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio;
  const x = cv.getContext('2d'); x.scale(devicePixelRatio, devicePixelRatio);
  const d = SIM.day, vis = d.cs.slice(0, SIM.cur + 1), p = SIM.pos;
  const col = {up: css('--up'), down: css('--down'), ink: css('--ink'), muted: css('--muted'), line: css('--line'), acc: css('--accent'), info: css('--info')};
  const axis = 62, volH = H * .17, top = 10, bot = H - volH - 26, pw = W - axis;
  let lo = Math.min(...vis.map(k => Math.min(k.l, k.vwap))), hi = Math.max(...vis.map(k => Math.max(k.h, k.vwap)));
  if(p){ lo = Math.min(lo, p.stop, p.target); hi = Math.max(hi, p.stop, p.target); }
  const padv = (hi - lo) * .08 || 1; lo -= padv; hi += padv;
  const Y = v => top + (hi - v) / (hi - lo) * (bot - top), st = pw / d.N, X = i => i * st + st / 2, bw = Math.max(2, st * .64);
  x.font = '600 11px "JetBrains Mono", monospace'; x.textBaseline = 'middle';
  const stepV = niceStep((hi - lo) / 5);
  for(let v = Math.ceil(lo / stepV) * stepV; v <= hi; v += stepV){ x.strokeStyle = col.line; x.lineWidth = 1; x.beginPath(); x.moveTo(0, Y(v)); x.lineTo(pw, Y(v)); x.stroke(); x.fillStyle = col.muted; x.fillText(de(v, 2), pw + 6, Y(v)); }
  x.textBaseline = 'alphabetic';
  for(let i = 5; i < d.N; i += 12){ const m = 9 * 60 + 30 + (i + 1) * 5; x.fillStyle = col.muted; x.fillText(Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'), X(i) - 16, H - 6); }
  // opening range
  x.fillStyle = col.muted; x.globalAlpha = .08; x.fillRect(0, Y(d.orH), X(5) + st / 2, Y(d.orL) - Y(d.orH)); x.globalAlpha = .5;
  x.setLineDash([4, 4]); x.strokeStyle = col.muted; [d.orH, d.orL].forEach(v => { x.beginPath(); x.moveTo(0, Y(v)); x.lineTo(pw, Y(v)); x.stroke(); }); x.setLineDash([]); x.globalAlpha = 1;
  // position zones
  if(p){ const x0 = X(p.i); x.globalAlpha = .12; x.fillStyle = col.up; x.fillRect(x0, Math.min(Y(p.entry), Y(p.target)), pw - x0, Math.abs(Y(p.target) - Y(p.entry))); x.fillStyle = col.down; x.fillRect(x0, Math.min(Y(p.entry), Y(p.stop)), pw - x0, Math.abs(Y(p.stop) - Y(p.entry))); x.globalAlpha = 1;
    [[p.entry, col.ink, 'Entry'], [p.stop, col.down, 'Stop'], [p.target, col.up, 'Ziel']].forEach(([v, c, t]) => { x.strokeStyle = c; x.lineWidth = 1.5; x.beginPath(); x.moveTo(x0, Y(v)); x.lineTo(pw, Y(v)); x.stroke(); x.fillStyle = c; x.fillRect(pw, Y(v) - 9, axis, 18); x.fillStyle = css('--surface'); x.textBaseline = 'middle'; x.fillText(de(v, 2), pw + 6, Y(v)); x.textBaseline = 'alphabetic'; }); }
  // volume
  const vmax = Math.max(...d.cs.slice(0, Math.max(SIM.cur + 1, 20)).map(k => k.v));
  vis.forEach((k, i) => { x.fillStyle = k.c >= k.o ? col.up : col.down; x.globalAlpha = .35; const vh = k.v / vmax * (volH - 6); x.fillRect(X(i) - bw / 2, H - 22 - vh, bw, vh); }); x.globalAlpha = 1;
  // candles
  vis.forEach((k, i) => { const c = k.c >= k.o ? col.up : col.down; x.strokeStyle = x.fillStyle = c; x.lineWidth = 1.2; x.beginPath(); x.moveTo(X(i), Y(k.h)); x.lineTo(X(i), Y(k.l)); x.stroke(); x.fillRect(X(i) - bw / 2, Y(Math.max(k.o, k.c)), bw, Math.max(1.2, Math.abs(Y(k.o) - Y(k.c)))); });
  // overlays
  [['vwap', col.acc, 2.2], ['ema', col.info, 1.6]].forEach(([key, c, lw]) => { x.strokeStyle = c; x.lineWidth = lw; x.beginPath(); vis.forEach((k, i) => i ? x.lineTo(X(i), Y(k[key])) : x.moveTo(X(i), Y(k[key]))); x.stroke(); });
  // trade markers
  const tri = (i, v, up, c) => { x.fillStyle = c; x.beginPath(); const yy = Y(v) + (up ? 10 : -10); x.moveTo(X(i), yy + (up ? -6 : 6)); x.lineTo(X(i) - 6, yy + (up ? 5 : -5)); x.lineTo(X(i) + 6, yy + (up ? 5 : -5)); x.fill(); };
  SIM.trades.forEach(t => { tri(t.i, t.entry, t.side > 0, t.side > 0 ? col.up : col.down); x.fillStyle = col.ink; x.beginPath(); x.arc(X(t.j), Y(t.exit), 4, 0, 7); x.fill(); });
  if(p) tri(p.i, p.entry, p.side > 0, p.side > 0 ? col.up : col.down);
  // last price tag
  const lk = vis[vis.length - 1]; x.fillStyle = col.ink; x.fillRect(pw, Y(lk.c) - 10, axis, 20); x.fillStyle = css('--surface'); x.textBaseline = 'middle'; x.font = '700 12px "JetBrains Mono", monospace'; x.fillText(de(lk.c, 2), pw + 6, Y(lk.c));
}
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }

/* ---------- Views: Profile ---------- */
function profile(){
  const l = levelOf(S.xp);
  main.innerHTML = `<div class="stage"><div style="display:grid;gap:6px"><span class="eyebrow">Profil</span><h1>Level ${l + 1} · ${TITLES[l]}</h1></div>
   <section class="bigstats"><div><span class="eyebrow">XP</span><b>${de(S.xp)}</b></div><div><span class="eyebrow">Serie · Rekord ${S.bestStreak}</span><b>${S.streak} ${S.streak === 1 ? 'Tag' : 'Tage'}</b></div><div><span class="eyebrow">Module</span><b>${MODS.filter(modDone).length}/8</b></div><div><span class="eyebrow">Sim-Ergebnis</span><b>${S.simTotalR >= 0 ? '+' : ''}${de(S.simTotalR, 1)}R</b></div></section>
   <section class="card" style="display:grid;gap:16px"><div class="navrow"><h3>Serie</h3><span class="chip" style="color:var(--info)"><span style="width:16px;height:16px;display:inline-grid">${SNOW}</span>${S.freezes}/2 Serienschutz</span></div>
     <div class="grid2" style="align-items:start"><div style="display:grid;gap:10px"><span class="eyebrow">Letzte 5 Wochen</span>${heatmap()}<div class="legend"><span><i style="background:var(--accent);height:10px;width:10px"></i>Ziel geschafft</span><span><i style="background:var(--info);height:10px;width:10px"></i>Serienschutz</span></div></div>
     <div style="display:grid;gap:10px"><span class="eyebrow">Tagesziel</span><div class="seg" style="grid-template-columns:repeat(4,1fr)">${GOALS.map(([v, n]) => `<button class="${S.goal === v ? 'on' : ''}" data-act="goal" data-v="${v}">${n}<br><span class="num muted" style="font-size:12px">${v} XP</span></button>`).join('')}</div>
     <p class="muted" style="font-size:14px">Schaffst du dein Tagesziel, wächst die Serie um einen Tag. Alle 7 Tage bekommst du einen Serienschutz (max. 2). Der springt automatisch ein, wenn du mal einen Tag verpasst.</p></div></div></section>
   <section class="card" style="display:grid;gap:14px"><h3>Abzeichen <span class="muted num">${Object.keys(S.badges).length}/${BADGES.length}</span></h3><div class="badges">${BADGES.map(b => `<div class="badge ${S.badges[b.id] ? 'got' : ''}"><b>${b.n}</b><small>${b.d}</small></div>`).join('')}</div></section>
   <section class="card" style="display:grid;gap:14px"><h3>Einstellungen</h3>
     <div class="navrow"><span>Soundeffekte</span><button class="btn" data-act="sound">${S.sound ? 'An' : 'Aus'}</button></div>
     <div class="navrow"><span>Tastenkürzel anzeigen</span><button class="btn" data-act="help">Öffnen <kbd>?</kbd></button></div>
     <div class="navrow"><span>Fortschritt löschen <span class="muted">(XP, Module, Rekorde)</span></span><span id="resetwrap"><button class="btn" data-act="reset1">Zurücksetzen</button></span></div>
   </section><p class="disclaimer">Dein Fortschritt liegt nur in diesem Browser. Lernen ersetzt keine Anlageberatung.</p></div>`;
}

function heatmap(){
  const t = dayStr(), now = new Date(t + 'T12:00:00'), mon = addDays(t, -((now.getDay() + 6) % 7) - 28);
  let h = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(n => `<span class="eyebrow" style="font-size:10px;text-align:center">${n}</span>`).join('');
  for(let i = 0; i < 35; i++){ const d = addDays(mon, i); h += `<i class="${S.met[d] ? 'met' : S.frozen[d] ? 'frz' : ''} ${d === t ? 'today' : ''} ${d > t ? 'fut' : ''}" title="${d}: ${S.days[d] || 0} XP"></i>`; }
  return `<div class="heat">${h}</div>`;
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if(V.act && V.act[a]){ V.act[a](b.dataset); return; }
  switch(a){
    case 'go': if(helpOpen) toggleHelp(); go(v); break;
    case 'learn': go('player', {id: v}); break;
    case 'quiz': go('player', {id: v, quiz: true}); break;
    case 'pnext': pNext(); break;
    case 'pprev': pPrev(); break;
    case 'pans': pAnswer(+v); break;
    case 'simlong': simEnter(1); break;
    case 'simshort': simEnter(-1); break;
    case 'simclose': simClose(); break;
    case 'simbe': simBE(); break;
    case 'simstep': simStep(); break;
    case 'simplay': simPlay(); break;
    case 'simrisk': SIM.riskPct = +v; simUpdate(); break;
    case 'simnew': newSim(); simView(); break;
    case 'sound': S.sound = !S.sound; save(); profile(); if(S.sound) sfx('ok'); break;
    case 'help': toggleHelp(); break;
    case 'closepop': closePop(); if(V.name === 'home') home(); break;
    case 'goal': S.goal = +v; save(); if((S.days[dayStr()] || 0) >= S.goal) extendStreak(); profile(); renderStats(); break;
    case 'reset1': $('#resetwrap').innerHTML = '<button class="btn down" data-act="reset2">Wirklich alles löschen</button> <button class="btn" data-act="go" data-v="profile">Abbrechen</button>'; break;
    case 'reset2': S = JSON.parse(JSON.stringify(DEF)); save(); SIM = null; toast('Fortschritt gelöscht'); go('home'); break;
  }
});
document.addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey || e.repeat && e.key !== ' ' && e.key !== 'ArrowRight') return;
  const k = e.key;
  if(popOpen){ if(k === 'Escape' || k === 'Enter' || k === ' '){ closePop(); if(V.name === 'home') home(); e.preventDefault(); } return; }
  if(k === '?' || (k === '/' && e.shiftKey)){ toggleHelp(); e.preventDefault(); return; }
  if(helpOpen){ if(k === 'Escape' || k === 'Enter'){ toggleHelp(); e.preventDefault(); } return; }
  if(V.key && V.key(k, e)){ e.preventDefault(); return; }
  if(V.nav){ const n = NAV.find(x => x[2].toLowerCase() === k.toLowerCase()); if(n){ go(n[0]); e.preventDefault(); return; } }
  if(k === 'Escape' && V.name !== 'home'){ go('home'); e.preventDefault(); }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if(V.name === 'sim') drawSim(); if(V.name === 'home') drawHero(); }, 120); });
try { if('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch(e){}

// Migrate old streak data (before the daily goal existed)
if(S.lastDay && !Object.keys(S.met).length && S.streak) S.met[S.lastDay] = true;
checkStreak();
go('home');
if(S.pendingPop){ const p = S.pendingPop; delete S.pendingPop; save();
  setTimeout(() => showPop(p.kind === 'frozen'

    : `<div class="pop" style="display:grid;gap:14px">${flame(80, false)}<h2>Deine Serie ist gerissen</h2><p class="muted" style="max-width:40ch">${p.n} ${p.n === 1 ? 'Tag' : 'Tage'} waren es. Kein Drama: Hol dir heute ${S.goal} XP und die nächste Serie läuft. Dein Rekord bleibt: ${S.bestStreak} Tage.</p><button class="btn pri big" data-act="closepop">Neue Serie starten <kbd>Enter</kbd></button></div>`), 300); }
